<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ricochet</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <main id="app">
      <header>
        <h1>RICO<b>CHET</b> <span>mode Contrôle</span></h1>
        <button id="btnMute" title="Son">🔊</button>
      </header>

      <div id="stagewrap">
        <div id="stagehost"></div>

        <div id="hud" hidden></div>

        <div id="overlay" hidden></div>
        <div id="curtain" hidden></div>
      </div>

      <p class="hint">
        <b>Attrape</b> un héros et <b>glisse</b> pour viser, <b>lâche</b> pour tirer.
        <b>Clic gauche</b> = lancer normal · <b>clic droit</b> = lancer avec la
        capacité (elle coûte du Momentum). Au clavier, <b>A</b> arme la capacité
        pour le tour. <b>Espace</b> passe l'animation.
        <a href="./docs/ricochet-playbook.html">bible</a> ·
        <a href="./docs/PHASES.md">phases</a>
      </p>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
